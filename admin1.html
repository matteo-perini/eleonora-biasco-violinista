<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Admin | Eleonora Biasco</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ANGOLI RIGOROSAMENTE SQUADRATI E DESIGN SUPER COMPATTO */
    *, *::before, *::after {
      border-radius: 0 !important;
    }

    body {
      background-color: var(--bg-color, #121212);
      color: var(--text-color, #f5f5f5);
      font-family: var(--font-body, 'Montserrat', sans-serif);
      margin: 0;
      padding: 0;
    }

    .admin-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 10px;
    }

    .admin-box {
      background: var(--bg-card, rgba(26, 26, 26, 0.9));
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 16px 20px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7), 0 0 10px rgba(212, 175, 55, 0.1);
      margin-bottom: 12px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      padding-bottom: 8px;
    }

    .admin-header h2 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--primary-color, #d4af37);
      font-family: var(--font-heading, 'Cinzel', serif);
    }

    .btn-logout {
      background: transparent;
      color: var(--text-muted, #aaaaaa);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 3px 8px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      color: #ff4d4d;
      border-color: #ff4d4d;
    }

    .admin-section-title {
      color: var(--primary-color, #d4af37);
      font-family: var(--font-heading, 'Cinzel', serif);
      font-size: 0.95rem;
      margin-top: 0;
      margin-bottom: 10px;
      border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
      padding-bottom: 4px;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .gruppo-input {
      margin-bottom: 0;
    }

    .gruppo-input label {
      color: var(--primary-color, #d4af37);
      font-weight: 600;
      margin-bottom: 3px;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
    }

    .gruppo-input input,
    .gruppo-input select {
      width: 100%;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--text-color, #f5f5f5);
      font-size: 0.8rem;
      box-sizing: border-box;
      outline: none;
    }

    .gruppo-input input:focus,
    .gruppo-input select:focus {
      border-color: var(--primary-color, #d4af37);
      box-shadow: 0 0 5px rgba(212, 175, 55, 0.4);
    }

    .gruppo-input select option {
      background-color: var(--bg-color, #121212);
      color: var(--text-color, #f5f5f5);
    }

    .btn-invia {
      background: #121212;
      color: var(--primary-color, #d4af37);
      border: 1px solid var(--primary-color, #d4af37);
      padding: 7px 15px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      margin-top: 2px;
    }

    .btn-invia:hover {
      background: var(--primary-color, #d4af37);
      color: #121212;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.4);
    }

    /* BOTTONE A TENDINA */
    .dropdown-toggle-btn {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--primary-color, #d4af37);
      padding: 7px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      margin-bottom: 8px;
    }

    .dropdown-toggle-btn:hover {
      background: rgba(212, 175, 55, 0.2);
    }

    .dropdown-content-box {
      display: none;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      padding-top: 8px;
    }

    .dropdown-content-box.active {
      display: block;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .search-input, .filter-select {
      flex: 1;
      padding: 5px 8px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--text-color, #f5f5f5);
      font-size: 0.75rem;
      box-sizing: border-box;
      outline: none;
    }

    .search-input:focus, .filter-select:focus {
      border-color: var(--primary-color, #d4af37);
    }

    .track-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 3px;
    }

    .track-list::-webkit-scrollbar {
      width: 3px;
    }
    .track-list::-webkit-scrollbar-thumb {
      background: var(--primary-color, #d4af37);
    }

    .track-item {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(212, 175, 55, 0.15);
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .track-item-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow: hidden;
    }

    .track-item-title {
      color: #fff;
      font-weight: 600;
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-item-category {
      color: var(--primary-color, #d4af37);
      font-size: 0.65rem;
      opacity: 0.8;
    }

    .actions-group {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-action {
      padding: 3px 6px;
      cursor: pointer;
      font-size: 0.65rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-edit {
      background: rgba(212, 175, 55, 0.15);
      color: var(--primary-color, #d4af37);
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .btn-edit:hover {
      background: var(--primary-color, #d4af37);
      color: #000;
    }

    .btn-delete {
      background: rgba(255, 77, 77, 0.15);
      color: #ff4d4d;
      border: 1px solid rgba(255, 77, 77, 0.3);
    }

    .btn-delete:hover {
      background: #ff4d4d;
      color: #000;
    }

    #login-error {
      color: #ff4d4d;
      font-size: 0.75rem;
      text-align: center;
      display: none;
    }

    .status-msg {
      font-size: 0.75rem;
      text-align: center;
      margin-top: -2px;
      display: none;
    }

    /* MODALE POPUP PERSONALIZZATO */
    .custom-popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 999999;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .custom-popup-overlay.active { display: flex; }

    .custom-popup-box {
      background: var(--bg-card, #1a1a1a);
      border: 1px solid var(--primary-color, #d4af37);
      padding: 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.2);
    }

    .custom-popup-icon {
      font-size: 2rem;
      margin-bottom: 6px;
      display: block;
    }

    .custom-popup-title {
      color: var(--primary-color, #d4af37);
      font-family: var(--font-heading, 'Cinzel', serif);
      font-size: 1.05rem;
      margin-top: 0;
      margin-bottom: 6px;
    }

    .custom-popup-text {
      color: var(--text-color, #f5f5f5);
      font-size: 0.82rem;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .custom-popup-buttons {
      display: flex;
      gap: 8px;
    }

    .custom-popup-btn {
      flex: 1;
      padding: 7px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .btn-confirm-yes {
      background: #ff4d4d;
      color: #000;
      border: 1px solid #ff4d4d;
    }
    .btn-confirm-yes:hover { background: #ff3333; }

    .btn-confirm-no {
      background: transparent;
      color: var(--text-muted, #aaaaaa);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-confirm-no:hover { color: #fff; border-color: #fff; }

    .btn-alert-ok {
      background: var(--primary-color, #d4af37);
      color: #121212;
      border: 1px solid var(--primary-color, #d4af37);
    }

    /* MODALE MODIFICA BRANO */
    .edit-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .edit-modal.active { display: flex; }
  </style>
</head>
<body>

  <div class="admin-wrapper">

    <!-- SCHEDA DI LOGIN -->
    <div class="admin-box" id="login-card">
      <div style="text-align: center; margin-bottom: 15px;">
        <h2 style="color: var(--primary-color, #d4af37); margin-bottom: 3px;">Accesso Riservato</h2>
        <p style="color: var(--text-muted, #aaaaaa); font-size: 0.75rem; margin: 0;">Pannello di Gestione</p>
      </div>

      <form id="login-form" class="admin-form">
        <div class="gruppo-input">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="Inserisci email" required>
        </div>
        <div class="gruppo-input">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Inserisci password" required>
        </div>
        <div id="login-error">Credenziali errate o non autorizzate.</div>
        <button type="submit" class="btn-invia">Accedi</button>
      </form>
    </div>

    <!-- PANNELLO ADMIN (PROTETTO) -->
    <div id="admin-panel" style="display: none; width: 100%; max-width: 550px;">
      
      <div class="admin-box" style="margin-bottom: 10px; padding: 10px 20px;">
        <div class="admin-header" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">
          <h2>Gestione Contenuti</h2>
          <button type="button" class="btn-logout" onclick="window.logout()">Esci ✕</button>
        </div>
      </div>

      <!-- SEZIONE CAMBIO PASSWORD CLIENTE -->
      <div class="admin-box">
        <h3 class="admin-section-title">🔒 Sicurezza Account</h3>
        <form id="change-password-form" class="admin-form">
          <div class="gruppo-input">
            <label for="new-password">Nuova Password</label>
            <input type="password" id="new-password" placeholder="Inserisci nuova password" required minlength="6">
          </div>
          <div class="gruppo-input">
            <label for="confirm-password">Conferma Nuova Password</label>
            <input type="password" id="confirm-password" placeholder="Ripeti nuova password" required minlength="6">
          </div>
          <div id="password-status" class="status-msg"></div>
          <button type="submit" class="btn-invia">Aggiorna Password</button>
        </form>
      </div>

      <!-- GESTIONE BRANI -->
      <div class="admin-box">
        <h3 class="admin-section-title">🎵 Gestione Brani Audio</h3>

        <form id="upload-form-audio" class="admin-form">
          <div class="gruppo-input">
            <label for="track-title">Titolo del Brano</label>
            <input type="text" id="track-title" placeholder="Es. Hallelujah..." required>
          </div>
          <div class="gruppo-input">
            <label for="track-category">Categoria</label>
            <select id="track-category" required>
              <option value="Leggera">Leggera</option>
              <option value="Pop">Pop</option>
              <option value="Colonne sonore">Colonne sonore</option>
              <option value="Lounge">Lounge</option>
              <option value="Dance">Dance</option>
            </select>
          </div>
          <div class="gruppo-input">
            <label for="audio-file">File Audio (MP3 / M4A)</label>
            <input type="file" id="audio-file" accept=".mp3, .m4a, audio/*" required>
          </div>
          <div id="audio-status" class="status-msg"></div>
          <button type="submit" class="btn-invia" id="btn-submit-audio">➕ Pubblica Brano</button>
        </form>

        <div class="track-list-section">
          <button type="button" class="dropdown-toggle-btn" onclick="window.toggleAudioDropdown()">
            <span>📂 Brani Inseriti (<span id="track-count">0</span>)</span>
            <span id="audio-arrow">▼</span>
          </button>

          <div class="dropdown-content-box" id="audio-dropdown-box">
            <div class="filter-row">
              <input type="text" id="search-audio-input" class="search-input" placeholder="🔍 Cerca..." onkeyup="window.filterAudioTracks()">
              <select id="filter-category-select" class="filter-select" onchange="window.filterAudioTracks()">
                <option value="tutte">Tutte</option>
                <option value="Leggera">Leggera</option>
                <option value="Pop">Pop</option>
                <option value="Colonne sonore">Colonne sonore</option>
                <option value="Lounge">Lounge</option>
                <option value="Dance">Dance</option>
              </select>
            </div>
            <ul class="track-list" id="track-list"></ul>
          </div>
        </div>
      </div>

      <!-- GESTIONE VIDEO (CON AUTOCOMPRESSIONE > 20 MB) -->
      <div class="admin-box">
        <h3 class="admin-section-title">🎬 Gestione Video / Reels</h3>

        <form id="upload-form-video" class="admin-form">
          <div class="gruppo-input">
            <label for="video-file">File Video (MP4 / MOV)</label>
            <input type="file" id="video-file" accept="video/mp4, video/quicktime, video/mov, video/*" required>
          </div>
          <div id="video-status" class="status-msg"></div>
          <button type="submit" class="btn-invia" id="btn-submit-video">🎬 Pubblica Video</button>
        </form>

        <div class="track-list-section">
          <button type="button" class="dropdown-toggle-btn" onclick="window.toggleVideoDropdown()">
            <span>📂 Video Inseriti (<span id="video-count">0</span>)</span>
            <span id="video-arrow">▼</span>
          </button>

          <div class="dropdown-content-box" id="video-dropdown-box">
            <ul class="track-list" id="video-list"></ul>
          </div>
        </div>
      </div>

      <!-- GESTIONE FOTO (CON AUTOCOMPRESSIONE > 2 MB E QUALITÀ AL 80%) -->
      <div class="admin-box">
        <h3 class="admin-section-title">🖼️ Gestione Foto Carosello (Index)</h3>

        <form id="upload-form-photo" class="admin-form">
          <div class="gruppo-input">
            <label for="photo-file">File Foto (JPG, JPEG, PNG, HEIC)</label>
            <input type="file" id="photo-file" accept="image/*, .heic, .heif" required>
          </div>
          <div id="photo-status" class="status-msg"></div>
          <button type="submit" class="btn-invia" id="btn-submit-photo">🖼️ Pubblica Foto</button>
        </form>

        <div class="track-list-section">
          <button type="button" class="dropdown-toggle-btn" onclick="window.togglePhotoDropdown()">
            <span>📂 Foto Inserite (<span id="photo-count">0</span>)</span>
            <span id="photo-arrow">▼</span>
          </button>

          <div class="dropdown-content-box" id="photo-dropdown-box">
            <ul class="track-list" id="photo-list"></ul>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- MODALI -->
  <div class="edit-modal" id="editModal">
    <div class="admin-box" style="max-width: 350px; margin: 0; padding: 20px;">
      <h3 style="color: var(--primary-color, #d4af37); margin-top: 0; font-family: var(--font-heading, 'Cinzel', serif); font-size: 1rem; margin-bottom: 10px;">Modifica Brano</h3>
      <form id="edit-form" style="display: flex; flex-direction: column; gap: 8px;">
        <input type="hidden" id="edit-doc-id">
        <div class="gruppo-input">
          <label for="edit-title">Nuovo Titolo</label>
          <input type="text" id="edit-title" required>
        </div>
        <div class="gruppo-input">
          <label for="edit-category">Nuova Categoria</label>
          <select id="edit-category" required>
            <option value="Leggera">Leggera</option>
            <option value="Pop">Pop</option>
            <option value="Colonne sonore">Colonne sonore</option>
            <option value="Lounge">Lounge</option>
            <option value="Dance">Dance</option>
          </select>
        </div>
        <div style="display: flex; gap: 6px; margin-top: 6px;">
          <button type="submit" class="btn-invia" style="padding: 6px;">Salva</button>
          <button type="button" class="btn-invia" style="background: transparent; color: #fff; border-color: rgba(255,255,255,0.3); padding: 6px;" onclick="window.closeEditModal()">Annulla</button>
        </div>
      </form>
    </div>
  </div>

  <div class="custom-popup-overlay" id="customPopup">
    <div class="custom-popup-box">
      <span class="custom-popup-icon" id="popupIcon">⚠️</span>
      <h3 class="custom-popup-title" id="popupTitle">Conferma</h3>
      <p class="custom-popup-text" id="popupText">Procedere?</p>
      <div class="custom-popup-buttons" id="popupButtons"></div>
    </div>
  </div>

  <!-- SCRIPT FIREBASE AUTH & STORAGE/FIRESTORE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDpFJSJppEf3YUek4vgbbG9kzyYr0xYj4s",
      authDomain: "violinista-eleonora.firebaseapp.com",
      projectId: "violinista-eleonora",
      storageBucket: "violinista-eleonora.firebasestorage.app",
      messagingSenderId: "5833623770",
      appId: "1:5833623770:web:99467a55c0e30abd747de3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const auth = getAuth(app);

    let braniFirebase = [];
    let videoFirebase = [];
    let fotoFirebase = [];

    const loginCard = document.getElementById('login-card');
    const adminPanel = document.getElementById('admin-panel');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginCard.style.display = "none";
        adminPanel.style.display = "block";
        await Promise.all([caricaBraniFirebase(), caricaVideoFirebase(), caricaFotoFirebase()]);
      } else {
        adminPanel.style.display = "none";
        loginCard.style.display = "block";
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      loginError.style.display = "none";

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error(err);
        loginError.style.display = "block";
      }
    });

    window.logout = async function() {
      try {
        await signOut(auth);
        document.getElementById('login-email').value = "";
        document.getElementById('login-password').value = "";
      } catch (err) {
        console.error(err);
      }
    };

    const changePasswordForm = document.getElementById('change-password-form');
    changePasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPass = document.getElementById('new-password').value.trim();
      const confirmPass = document.getElementById('confirm-password').value.trim();
      const statusMsg = document.getElementById('password-status');

      statusMsg.style.display = "block";

      if (newPass !== confirmPass) {
        statusMsg.style.color = "#ff4d4d";
        statusMsg.textContent = "Le password non coincidono.";
        return;
      }

      const user = auth.currentUser;
      if (user) {
        try {
          await updatePassword(user, newPass);
          statusMsg.style.color = "#2ecc71";
          statusMsg.textContent = "✅ Password aggiornata con successo!";
          changePasswordForm.reset();
          window.mostraAlert("Sicurezza", "Password modificata con successo!", "🔒");
        } catch (err) {
          statusMsg.style.color = "#ff4d4d";
          statusMsg.textContent = "Errore: effettua nuovamente il login.";
        }
      }
    });

    window.mostraConferma = function(titolo, testo, icona, callbackYes) {
      const overlay = document.getElementById('customPopup');
      document.getElementById('popupTitle').textContent = titolo;
      document.getElementById('popupText').textContent = testo;
      document.getElementById('popupIcon').textContent = icona;
      
      const btnContainer = document.getElementById('popupButtons');
      btnContainer.innerHTML = `
        <button class="custom-popup-btn btn-confirm-yes" id="popupYesBtn">Sì</button>
        <button class="custom-popup-btn btn-confirm-no" id="popupNoBtn">No</button>
      `;
      overlay.classList.add('active');

      document.getElementById('popupYesBtn').onclick = () => {
        overlay.classList.remove('active');
        callbackYes();
      };
      document.getElementById('popupNoBtn').onclick = () => {
        overlay.classList.remove('active');
      };
    };

    window.mostraAlert = function(titolo, testo, icona = "✨") {

    async function comprimiVideoSeNecessario(file, statusElement) {
      const LIMITE_MB = 20;
      const fileMB = file.size / (1024 * 1024);

      if (fileMB <= LIMITE_MB) return file;

      statusElement.textContent = `⚡ Video grande (${fileMB.toFixed(1)}MB): compressione in corso...`;

      return new Promise((resolve) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.src = URL.createObjectURL(file);

        video.onloadedmetadata = async () => {
          window.URL.revokeObjectURL(video.src);
          video.currentTime = 0;

          const canvas = document.createElement('canvas');
          let width = video.videoWidth;
          let height = video.videoHeight;
          const maxWidth = 1280;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');

          const stream = canvas.captureStream(25);
          let recorderOptions = { mimeType: 'video/webm;codecs=vp9' };
          if (!MediaRecorder.isTypeSupported(recorderOptions.mimeType)) recorderOptions = { mimeType: 'video/webm' };
          if (!MediaRecorder.isTypeSupported(recorderOptions.mimeType)) recorderOptions = {};

          let mediaRecorder;
          try {
            mediaRecorder = new MediaRecorder(stream, recorderOptions);
          } catch (e) {
            resolve(file);
            return;
          }

          const chunks = [];
          mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".mp4", { type: 'video/mp4' });
            statusElement.textContent = `✅ Compressione video OK! Nuovo peso: ${(compressedFile.size / (1024 * 1024)).toFixed(1)}MB`;
            resolve(compressedFile);
          };

          mediaRecorder.start();
          video.play();

          function drawFrame() {
            if (video.paused || video.ended) {
              mediaRecorder.stop();
              return;
            }
            ctx.drawImage(video, 0, 0, width, height);
            requestAnimationFrame(drawFrame);
          }
          drawFrame();

          video.onended = () => {
            if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
          };
        };

        video.onerror = () => resolve(file);
      });
    }

    async function comprimiFotoSeNecessario(file, statusElement) {
      const LIMITE_MB = 2; // Soglia 2 MB per le foto
      const fileMB = file.size / (1024 * 1024);

      if (fileMB <= LIMITE_MB) return file;

      statusElement.textContent = `⚡ Foto grande (${fileMB.toFixed(1)}MB): ottimizzazione in corso...`;

      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxWidth = 1920; // Full HD web standard

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Conversione in JPEG con qualità impostata all'80% (0.8)
            canvas.toBlob((blob) => {
              if (!blob) {
                resolve(file);
                return;
              }
              const optimizedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: 'image/jpeg' });
              statusElement.textContent = `✅ Foto ottimizzata! Nuovo peso: ${(optimizedFile.size / (1024 * 1024)).toFixed(2)}MB`;
              resolve(optimizedFile);
            }, 'image/jpeg', 0.8);
          };
          img.onerror = () => resolve(file);
        };
        reader.onerror = () => resolve(file);
      });
    }
