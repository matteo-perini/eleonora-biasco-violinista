<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertitore HEIC | Eleonora Biasco</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Libreria di conversione robusta -->
  <script src="https://cdn.jsdelivr.net/npm/heic-to@1.1.2/dist/browser.umd.js"></script>
  <style>
    *, *::before, *::after {
      border-radius: 0 !important;
      box-sizing: border-box;
    }

    body {
      background-color: #121212;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .converter-wrapper {
      width: 100%;
      max-width: 480px;
      padding: 15px;
    }

    .converter-box {
      background: rgba(26, 26, 26, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7), 0 0 10px rgba(212, 175, 55, 0.1);
      text-align: center;
    }

    h1 {
      color: #d4af37;
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 8px;
    }

    p {
      color: #aaaaaa;
      font-size: 0.78rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .file-drop-area {
      border: 1px dashed rgba(212, 175, 55, 0.4);
      background: rgba(0, 0, 0, 0.4);
      padding: 25px 15px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .file-drop-area:hover {
      border-color: #d4af37;
      background: rgba(212, 175, 55, 0.05);
    }

    .file-drop-area input {
      display: none;
    }

    .file-msg {
      font-size: 0.8rem;
      color: #d4af37;
      font-weight: 500;
    }

    .btn-action {
      background: #121212;
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 10px 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }

    .btn-action:hover:not(:disabled) {
      background: #d4af37;
      color: #121212;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.4);
    }

    .btn-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 0.78rem;
      margin-top: 12px;
      font-weight: 500;
      min-height: 20px;
    }

    .back-link {
      display: block;
      margin-top: 15px;
      color: #aaaaaa;
      font-size: 0.72rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #d4af37;
    }
  </style>
</head>
<body>

  <div class="converter-wrapper">
    <div class="converter-box">
      <h1>Convertitore HEIC</h1>
      <p>Seleziona una foto in formato Apple (.heic / .HEIC) per trasformarla istantaneamente in un file JPEG pronto per il sito.</p>

      <label class="file-drop-area" id="drop-area">
        <span class="file-msg" id="file-msg">📂 Clicca qui o seleziona una foto HEIC</span>
        <input type="file" id="heic-file" accept=".heic, .HEIC, .heif, .HEIF, image/*">
      </label>

      <div id="status" class="status-msg"></div>

      <!-- Il pulsante di download comparirà a conversione ultimata -->
      <a id="download-btn" class="btn-action" style="display: none;">⬇️ Scarica Foto in JPEG</a>

      <a href="admin1.html" class="back-link">← Torna al Pannello Admin</a>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('heic-file');
    const fileMsg = document.getElementById('file-msg');
    const statusMsg = document.getElementById('status');
    const downloadBtn = document.getElementById('download-btn');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileMsg.textContent = `File scelto: ${file.name}`;
      downloadBtn.style.display = 'none';
      statusMsg.style.color = '#d4af37';
      statusMsg.textContent = '🔄 Conversione in corso...';

      try {
        let targetBlob = file;
        const isHeic = file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif') || file.type.includes('heic');

        if (isHeic && typeof heicTo !== 'undefined') {
          const convertedBlob = await heicTo({
            blob: file,
            type: "image/jpeg",
            quality: 0.90
          });
          targetBlob = convertedBlob;
        } else {
          // Fallback se è già un'immagine normale o browser nativo
          const reader = new FileReader();
          reader.readAsDataURL(file);
          await new Promise((resolve) => {
            reader.onload = (event) => {
              const img = new Image();
              img.src = event.target.result;
              img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                canvas.toBlob((blob) => {
                  targetBlob = blob;
                  resolve();
                }, 'image/jpeg', 0.90);
              };
            };
          });
        }

        // Crea il link per il download del file convertito in .jpg
        const url = URL.createObjectURL(targetBlob);
        const cleanName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
        
        downloadBtn.href = url;
        downloadBtn.download = cleanName + "_convertito.jpg";
        downloadBtn.style.display = 'inline-block';
        
        statusMsg.style.color = '#2ecc71';
        statusMsg.textContent = '✅ Conversione completata con successo!';

      } catch (err) {
        console.error(err);
        statusMsg.style.color = '#ff4d4d';
        statusMsg.textContent = '⚠️ Errore di conversione. Prova a fare uno screenshot della foto.';
      }
    });
  </script>

</body>
</html>
