<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recensioni - Dicono di noi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-color: #d4af37;
        --bg-color: #121212;
        --bg-card: rgba(26, 26, 26, 0.85);
        --text-color: #f5f5f5;
        --text-muted: #aaaaaa;
        --font-heading: 'Cinzel', serif;
        --font-body: 'Montserrat', sans-serif;
      }

      body {
        font-family: var(--font-body);
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
      }

      header {
        background: rgba(18, 18, 18, 0.95);
        border-bottom: 1px solid rgba(212, 175, 55, 0.35);
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .btn-back {
        color: var(--primary-color);
        text-decoration: none;
        font-size: 0.85rem;
        text-transform: uppercase;
        font-weight: 600;
      }

      h1, h2 {
        font-family: var(--font-heading);
        color: var(--primary-color);
        text-align: center;
        text-transform: uppercase;
      }

      .container {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .sezione-form, .sezione-bacheca {
        background: var(--bg-card);
        border: 1px solid rgba(212, 175, 55, 0.3);
        padding: 30px;
        border-radius: 10px;
        margin-bottom: 30px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      }

      /* BOX RIEPILOGO MEDIA E NUMERO RECENSIONI */
      .box-riepilogo {
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: rgba(18, 18, 18, 0.9);
        border: 1px solid rgba(212, 175, 55, 0.4);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 25px;
        text-align: center;
      }

      .riepilogo-valore {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--primary-color);
        font-family: var(--font-heading);
      }

      .riepilogo-etichetta {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 4px;
      }

      .gruppo-input {
        margin-bottom: 15px;
      }

      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 5px;
        color: var(--primary-color);
      }

      input, select, textarea {
        width: 100%;
        padding: 10px;
        background: #1a1a1a;
        border: 1px solid rgba(212, 175, 55, 0.4);
        color: #fff;
        border-radius: 6px;
        outline: none;
      }

      .btn-invia {
        background: var(--primary-color);
        color: #000;
        border: none;
        padding: 12px 20px;
        font-weight: bold;
        text-transform: uppercase;
        width: 100%;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.3s;
      }

      .btn-invia:hover {
        background: #fff;
      }

      .card-recensione {
        background: #1a1a1a;
        border: 1px solid rgba(212, 175, 55, 0.2);
        padding: 18px;
        border-radius: 6px;
        margin-bottom: 15px;
      }

      .header-card {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        color: var(--primary-color);
      }

      .testo-recensione {
        color: var(--text-muted);
        font-style: italic;
        margin: 10px 0;
        line-height: 1.5;
      }

      .data-recensione {
        font-size: 0.75rem;
        color: #777;
      }

      /* Stile Pop-up */
      .custom-popup {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.8);
        justify-content: center; align-items: center;
        z-index: 9999;
      }
      .custom-popup.active { display: flex; }
      .popup-content {
        background: #1a1a1a;
        border: 1px solid var(--primary-color);
        padding: 30px;
        border-radius: 10px;
        text-align: center;
        max-width: 320px;
      }
      .btn-popup {
        background: var(--primary-color);
        color: #000; border: none; padding: 8px 20px;
        font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px;
      }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-back">← Torna alla Home</a>
        <h1>Cosa dicono i nostri clienti</h1>
        <div></div>
    </header>

    <main class="container">
        
        <!-- Box di Riepilogo (Media e Totale Recensioni) -->
        <div class="box-riepilogo" id="boxRiepilogo" style="display: none;">
            <div>
                <div id="mediaStelleNum" class="riepilogo-valore">0.0</div>
                <div id="stelleVisual" style="font-size: 0.9rem; margin-top: 2px;">⭐⭐⭐⭐⭐</div>
                <div class="riepilogo-etichetta">Media Voti</div>
            </div>
            <div style="border-left: 1px solid rgba(212,175,55,0.2); height: 40px;"></div>
            <div>
                <div id="totaleRecensioniNum" class="riepilogo-valore">0</div>
                <div class="riepilogo-etichetta">Recensioni Totali</div>
            </div>
        </div>

        <!-- Sezione Form per inserire recensione -->
        <section class="sezione-form">
            <h2>Lascia una recensione</h2>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">La tua opinione è importante per noi.</p>
            
            <form id="form-recensioni">
                <div class="gruppo-input">
                    <label for="nome">Il tuo nome</label>
                    <input type="text" id="nome" name="nome" required placeholder="Es. Mario Rossi">
                </div>

                <div class="gruppo-input">
                    <label for="voto">Valutazione</label>
                    <select id="voto" name="voto" required>
                        <option value="5">⭐⭐⭐⭐⭐ (5/5) - Eccellente</option>
                        <option value="4">⭐⭐⭐⭐ (4/5) - Molto buono</option>
                        <option value="3">⭐⭐⭐ (3/5) - Buono</option>
                        <option value="2">⭐⭐ (2/5) - Sufficiente</option>
                        <option value="1">⭐ (1/5) - Da migliorare</option>
                    </select>
                </div>

                <div class="gruppo-input">
                    <label for="messaggio">La tua esperienza</label>
                    <textarea id="messaggio" name="messaggio" rows="4" required placeholder="Racconta brevemente come ti sei trovato..."></textarea>
                </div>

                <button type="submit" class="btn-invia" id="btnInviaRecensione">Invia recensione</button>
            </form>
        </section>

        <!-- Sezione Bacheca -->
        <section class="sezione-bacheca">
            <h2>Ultime recensioni</h2>
            <div id="contenitore-recensioni">
                <p style="color: var(--text-muted); text-align: center;">Caricamento recensioni in corso...</p>
            </div>
        </section>

    </main>

    <!-- Popup di conferma -->
    <div id="customPopup" class="custom-popup">
        <div class="popup-content">
            <span style="font-size: 2rem;">✨</span>
            <p id="popupMessage" style="margin: 10px 0; font-size: 0.9rem;">Recensione pubblicata con successo!</p>
            <button onclick="chiudiPopup()" class="btn-popup">Ottimo</button>
        </div>
    </div>

    <!-- Script Firebase e Logica recensioni -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDpFJSJppEf3YUek4vgbbG9kzyYr0xYj4s",
          authDomain: "violinista-eleonora.firebaseapp.com",
          projectId: "violinista-eleonora",
          storageBucket: "violinista-eleonora.firebasestorage.app",
          messagingSenderId: "5833623770",
          appId: "1:5833623770:web:99467a55c0e30abd747de3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqTPhG3_Zh9LP5reIK44uJzNso_5S_YFrKEc6AIKn4XDzNOL24M_gRD0AsLbmp_vrX/exec";

        window.chiudiPopup = function() {
            document.getElementById("customPopup").classList.remove("active");
        }

        function formattaData(timestamp) {
            if (!timestamp) return "";
            try {
                if (timestamp.toDate) {
                    return timestamp.toDate().toLocaleDateString("it-IT");
                }
                const d = new Date(timestamp);
                if (!isNaN(d.getTime())) {
                    return d.toLocaleDateString("it-IT");
                }
            } catch (e) {}
            return timestamp;
        }

        function creaCardHTML(nome, stelle, testo, data) {
            const numStelle = parseInt(stelle) || 5;
            const stelleStr = "⭐".repeat(numStelle);
            const dataPulita = formattaData(data);
            return `
                <div class="header-card">
                    <span>${nome}</span>
                    <span>${stelleStr}</span>
                </div>
                <p class="testo-recensione">"${testo}"</p>
                <span class="data-recensione">${dataPulita}</span>
            `;
        }

        async function caricaRecensioni() {
            const contenitore = document.getElementById("contenitore-recensioni");
            const boxRiepilogo = document.getElementById("boxRiepilogo");

            try {
                const colRef = collection(db, "recensioni");
                const q = query(colRef, orderBy("dataCaricamento", "desc"));
                let querySnapshot = await getDocs(q);

                // Se Firebase è vuoto, importa automaticamente le vecchie recensioni da Google Sheets!
                if (querySnapshot.empty) {
                    console.log("Database Firebase vuoto: importazione automatica da Google Sheets...");
                    try {
                        const res = await fetch(SCRIPT_URL);
                        const vecchie = await res.json();
                        if (vecchie && Array.isArray(vecchie) && vecchie.length > 0) {
                            for (const rec of vecchie) {
                                await addDoc(colRef, {
                                    nome: rec.nome || "Utente",
                                    testo: rec.messaggio || rec.testo || "",
                                    stelle: parseInt(rec.voto || 5),
                                    dataCaricamento: serverTimestamp()
                                });
                            }
                            // Ricarica la query dopo l'importazione
                            querySnapshot = await getDocs(q);
                        }
                    } catch (migrationErr) {
                        console.error("Errore durante l'importazione automatica:", migrationErr);
                    }
                }

                if (querySnapshot.empty) {
                    contenitore.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Ancora nessuna recensione.</p>`;
                    boxRiepilogo.style.display = "none";
                    return;
                }

                let sommaVoti = 0;
                let totale = 0;
                let cardsHTML = "";

                querySnapshot.forEach((docSnap) => {
                    const rec = docSnap.data();
                    const votoNum = parseInt(rec.stelle) || 5;
                    sommaVoti += votoNum;
                    totale++;

                    const cardDiv = document.createElement("div");
                    cardDiv.className = "card-recensione";
                    cardDiv.innerHTML = creaCardHTML(rec.nome, rec.stelle, rec.testo, rec.dataCaricamento);
                    cardsHTML += cardDiv.outerHTML;
                });

                const media = (sommaVoti / totale).toFixed(1);

                document.getElementById("mediaStelleNum").textContent = media;
                document.getElementById("totaleRecensioniNum").textContent = totale;
                boxRiepilogo.style.display = "flex";

                contenitore.innerHTML = cardsHTML;
            } catch (err) {
                console.error("Errore caricamento:", err);
                contenitore.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Impossibile caricare le recensioni.</p>`;
            }
        }

        document.getElementById("form-recensioni").addEventListener("submit", async function(e) {
            e.preventDefault();
            const nomeVal = document.getElementById("nome").value.trim();
            const votoVal = parseInt(document.getElementById("voto").value);
            const messaggioVal = document.getElementById("messaggio").value.trim();
            const btnInvia = document.getElementById("btnInviaRecensione");

            if (!nomeVal || !messaggioVal) return;

            btnInvia.disabled = true;
            btnInvia.textContent = "Invio in corso...";

            try {
                await addDoc(collection(db, "recensioni"), {
                    nome: nomeVal,
                    testo: messaggioVal,
                    stelle: votoVal,
                    dataCaricamento: serverTimestamp()
                });

                this.reset();
                document.getElementById("customPopup").classList.add("active");
                await caricaRecensioni();
            } catch (err) {
                console.error("Errore salvataggio:", err);
                alert("Errore durante l'invio della recensione.");
            } finally {
                btnInvia.disabled = false;
                btnInvia.textContent = "Invia recensione";
            }
        });

        caricaRecensioni();
    </script>
</body>
</html>
